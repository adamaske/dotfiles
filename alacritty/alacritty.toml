[window]
startup_mode = "Maximized"
opacity = 0.99
blur = false
padding.x = 8
padding.y = 8
decorations = "None"
decorations_theme_variant = "Dark"
title = "Alacritty"
dynamic_title = false

[terminal.shell]
program = "pwsh.exe"

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style.shape = "Beam"
style.blinking = "On"
blink_interval = 750
unfocused_hollow = true

[scrolling]
history = 50000
multiplier = 3

# Remove ':' so Rust paths (std::io::Error) and file:line select as one word
[selection]
semantic_escape_chars = ",│`|\"' ()[]{}<>\t"
save_to_clipboard = false

# ── Gruvbox Dark Hard ─────────────────────────────────────────────────────────
[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.cursor]
cursor = "#ebdbb2"
text = "#1d2021"

[colors.selection]
background = "#504945"
text = "#ebdbb2"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

# ── Hints ─────────────────────────────────────────────────────────────────────
# Ctrl+Shift+U  →  highlight URLs, press label key to open in browser
# Ctrl+Shift+F  →  highlight file paths (src/main.rs:42:5), press label to copy
[hints]
alphabet = "jfkdlsahgurieowpq"

[[hints.enabled]]
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\s<>"⟨⟩`]+'
hyperlinks = true
post_processing = true
persist = false
command = { program = "powershell", args = [
  "-NoProfile",
  "-Command",
  "Start-Process",
] }
binding = { key = "U", mods = "Control|Shift" }
mouse = { enabled = true, mods = "None" }

[[hints.enabled]]
regex = '[\w./-]+\.(?:rs|py|cpp|cc|cxx|c|h|hpp|toml|json|yaml|yml)(?::[0-9]+(?::[0-9]+)?)?'
post_processing = false
persist = false
action = "Copy"
binding = { key = "F", mods = "Control|Shift" }
mouse = { enabled = false }
