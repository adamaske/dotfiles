# ─── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix C-b

# ─── General ───────────────────────────────────────────────────────────────────
set -g prediction-dimming off
set -g focus-events on
set -g mouse on

# ─── Shell ─────────────────────────────────────────────────────────────────────
set -g default-shell "C:\Users\adama\AppData\Local\Microsoft\WindowsApps\pwsh.exe"

# ─── Keybindings ─────────────────────────────────────────────────────────────
# Defined here directly — don't rely on plugins loading for core bindings.

# Pane focus
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R
bind-key -T prefix Left  select-pane -L
bind-key -T prefix Down  select-pane -D
bind-key -T prefix Up    select-pane -U
bind-key -T prefix Right select-pane -R

# Pane resize (repeatable)
bind-key -r -T prefix M-h resize-pane -L 5
bind-key -r -T prefix M-j resize-pane -D 5
bind-key -r -T prefix M-k resize-pane -U 5
bind-key -r -T prefix M-l resize-pane -R 5

# Splits (cwd-aware)
bind-key -T prefix | split-window -h -c '#{pane_current_path}'
bind-key -T prefix - split-window -v -c '#{pane_current_path}'
bind-key -T prefix H split-window -hb -c '#{pane_current_path}'
bind-key -T prefix V split-window -vb -c '#{pane_current_path}'

# Windows
bind-key -T prefix c new-window
bind-key -T prefix n next-window
bind-key -T prefix p previous-window
bind-key -r -T prefix < swap-window -t -1
bind-key -r -T prefix > swap-window -t +1
bind-key -T prefix , command-prompt "rename-window '%%'"
bind-key -T prefix & kill-window
bind-key -n S-Left  previous-window
bind-key -n S-Right next-window

# Pane management
bind-key -T prefix z resize-pane -Z
bind-key -T prefix x kill-pane
bind-key -T prefix o select-pane -t :.+
bind-key -T prefix ! break-pane

# Sessions
bind-key -T prefix d detach-client
bind-key -T prefix $ command-prompt "rename-session '%%'"
bind-key -T prefix s choose-session

# Reload + help
bind-key -T prefix r source-file ~\.config\psmux\psmux.conf \; display-message "config reloaded"
bind-key -T prefix ? list-keys

# ── Plugins ──────────────────────────────────────────────────────────────────
# Plugins layer on top of the bindings above (e.g. pain-control will override
# splits with identical cwd-aware versions — that's fine, it's idempotent).
set -g @plugin 'psmux-plugins/psmux-theme-gruvbox'
source-file 'C:\Users\adama\.config\psmux\plugins\psmux-theme-gruvbox\plugin.conf'
set -g @plugin 'psmux-plugins/psmux-sensible'
source-file 'C:\Users\adama\.config\psmux\plugins\psmux-sensible\plugin.conf'
set -g @plugin 'psmux-plugins/psmux-resurrect'
source-file 'C:\Users\adama\.config\psmux\plugins\psmux-resurrect\plugin.conf'
set -g @plugin 'psmux-plugins/psmux-continuum'
source-file 'C:\Users\adama\.config\psmux\plugins\psmux-continuum\plugin.conf'
set -g @plugin 'psmux-plugins/psmux-pain-control'
source-file 'C:\Users\adama\.config\psmux\plugins\psmux-pain-control\plugin.conf'

# ── Post-plugin overrides ─────────────────────────────────────────────────────
# pain-control overrides 'c' with new-window -c '#{pane_current_path}' which
# fails silently on Windows paths. Rebind it plain after plugins are loaded.
bind-key -T prefix c new-window
bind-key -T prefix | split-window -h
bind-key -T prefix - split-window -v
# Server option — placed last so psmux-sensible (escape-time 50) can't override it
set -s escape-time 0
# ── End plugins ──────────────────────────────────────────────────────────────
