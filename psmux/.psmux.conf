# ─── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix C-b

# ─── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 10000
set -g prediction-dimming off
set -g cursor-style bar
set -g cursor-blink on

# ─── Shell ─────────────────────────────────────────────────────────────────────
set -g default-shell "C:\Program Files\WindowsApps\Microsoft.PowerShell_7.6.1.0_x64__8wekyb3d8bbwe"

# ─── Status bar ────────────────────────────────────────────────────────────────
set -g status-style          "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left           " #[bold]#S#[nobold] "
set -g status-left-length    20
set -g status-right          " %H:%M  %d -a "
set -g status-right-length   30
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "

# ─── Splits ────────────────────────────────────────────────────────────────────
#   prefix |   → split right (vertical divider)
#   prefix -   → split down  (horizontal divider)
#   prefix H   → split left  (opens pane on the left)
#   prefix V   → split up    (opens pane above)
bind-key -T prefix | split-window -h
bind-key -T prefix - split-window -v
bind-key -T prefix H split-window -hb
bind-key -T prefix V split-window -vb

# ─── Pane navigation ───────────────────────────────────────────────────────────
#   prefix h/j/k/l  → move focus left/down/up/right
#   prefix arrows   → same, for muscle memory
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R
bind-key -T prefix Left  select-pane -L
bind-key -T prefix Down  select-pane -D
bind-key -T prefix Up    select-pane -U
bind-key -T prefix Right select-pane -R

# ─── Pane resizing ─────────────────────────────────────────────────────────────
#   prefix Ctrl+h/j/k/l → resize by 5 cells
bind-key -T prefix C-h resize-pane -L 5
bind-key -T prefix C-j resize-pane -D 5
bind-key -T prefix C-k resize-pane -U 5
bind-key -T prefix C-l resize-pane -R 5

# ─── Pane management ───────────────────────────────────────────────────────────
#   prefix z   → zoom / unzoom current pane (toggle fullscreen)
#   prefix x   → kill current pane (with confirm)
#   prefix !   → break pane into its own window
#   prefix o   → cycle to next pane
bind-key -T prefix z resize-pane -Z
bind-key -T prefix x kill-pane
bind-key -T prefix ! break-pane
bind-key -T prefix o select-pane -t :.+

# ─── Window management ─────────────────────────────────────────────────────────
#   prefix c       → new window
#   prefix n / p   → next / previous window
#   prefix 1-9     → jump to window by number
#   prefix ,       → rename current window
#   prefix &       → kill current window (with confirm)
bind-key -T prefix c new-window
bind-key -T prefix n next-window
bind-key -T prefix p previous-window
bind-key -T prefix , command-prompt "rename-window '%%'"
bind-key -T prefix & kill-window

# ─── Session management ────────────────────────────────────────────────────────
#   prefix d   → detach from session
#   prefix $   → rename session
#   prefix s   → list/switch sessions
bind-key -T prefix d detach-client
bind-key -T prefix $ command-prompt "rename-session '%%'"
bind-key -T prefix s choose-session

# ─── Misc ──────────────────────────────────────────────────────────────────────
#   prefix r   → reload this config
#   prefix ?   → list all bindings
bind-key -T prefix r source-file ~\.config\psmux\.psmux.conf
bind-key -T prefix ? list-keys
