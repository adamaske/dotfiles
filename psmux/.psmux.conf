# =============================================================================
#  psmux config  —  mirrors ~/.config/tmux/tmux.conf (gruvbox dark hard)
#  Loaded via the PSMUX_CONFIG_FILE env var (-> this file).
#  NOTE: seamless nvim<->pane nav (vim-tmux-navigator) is NOT possible in psmux;
#  that flow lives in WezTerm panes + smart-splits.nvim. Here, pane nav is
#  prefix-based (PREFIX h/j/k/l), like a classic tmux.
# =============================================================================

# ── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──────────────────────────────────────────────────────────────────
set -g mouse on
# Let TUI apps (nvim, lazygit, claude) own the mouse so selection is native and
# consistent; in a plain shell pane use Shift+drag for WezTerm's own selection.
set -g mouse-selection off
# Keep Ctrl+V as visual-block / rectangle in nvim (don't treat it as a paste).
set -g paste-detection off
# copy-mode yanks go to the Windows clipboard. (Keep comments off value lines:
# psmux folds an inline comment into a string option's value.)
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 50000
set -g escape-time 0
set -g renumber-windows on
set -g cursor-style bar
set -g cursor-blink on
set -g mode-keys vi

# ── Status bar (gruvbox dark hard) ───────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1d2021,fg=#a89984"
set -g status-left "#[bg=#d79921,fg=#1d2021,bold] #{session_name} #[bg=#1d2021,fg=#d79921] "
set -g status-left-length 30
set -g status-right "#[fg=#458588]  %H:%M #[fg=#665c54]| #[fg=#98971a]%d %b"
set -g status-right-length 50
set -g window-status-format "#[fg=#665c54] #I:#W "
set -g window-status-current-format "#[bg=#3c3836,fg=#d79921,bold] #I:#W "
set -g window-status-separator ""

# ── Pane borders + messages ──────────────────────────────────────────────────
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"
set -g message-style "bg=#d79921,fg=#1d2021,bold"

# ── Splits  (PREFIX \ = right, PREFIX - = down) ──────────────────────────────
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Seamless nvim <-> psmux pane nav (vim-tmux-navigator protocol) ───────────
# In a (n)vim pane, pass Ctrl-hjkl through to nvim; otherwise move the psmux pane.
# Verified on psmux 3.3.4: bind -n (root table), if-shell -F, and
# #{pane_current_command} all work, so this behaves exactly like the Arch tmux.
bind -n C-h if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-l" "select-pane -R"

# ── Prefix pane nav (fallback + arrows) ──────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# Escape hatch: since bare C-l now navigates panes, PREFIX C-l (C-a C-l) sends a
# literal Ctrl-L to clear the screen.
bind C-l send-keys "C-l"

# ── Pane resize  (PREFIX H/J/K/L, repeatable) ────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Pane swap  (PREFIX < / >) ────────────────────────────────────────────────
bind < swap-pane -U
bind > swap-pane -D

# ── Pane misc ────────────────────────────────────────────────────────────────
bind z resize-pane -Z          # zoom toggle
bind x kill-pane
bind X kill-window
bind b break-pane -d           # break pane -> new window
bind o select-pane -t :.+      # cycle panes

# ── Windows ──────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind , command-prompt "rename-window '%%'"
bind n next-window
bind p previous-window
bind Tab last-window

# ── Sessions ─────────────────────────────────────────────────────────────────
bind s choose-tree -sZ
bind S new-session
bind d detach-client
bind $ command-prompt "rename-session '%%'"

# ── Copy mode (vi keys) ──────────────────────────────────────────────────────
bind v copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi H   send-keys -X start-of-line
bind -T copy-mode-vi L   send-keys -X end-of-line
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Popup scratchpad (PREFIX g) — test on your psmux build; drop if unsupported
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" pwsh

# ── Reload ───────────────────────────────────────────────────────────────────
bind r source-file "~/.config/psmux/.psmux.conf"
bind ? list-keys
