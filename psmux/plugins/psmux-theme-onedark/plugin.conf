# =============================================================================
# psmux-theme-onedark - Atom One Dark
# Style: Floating Neon Text (mirrors the tokyonight layout, One Dark palette)
# Active tab: bold bright text only, no bg, no arrows. Inactive: ghost dim.
# =============================================================================
#
# Palette (Atom One Dark):
#   bg=#282c34 bg_dark=#21252b bg_hl=#3e4451
#   fg=#abb2bf fg_dark=#828997 comment=#5c6370
#   blue=#61afef cyan=#56b6c2 green=#98c379
#   red=#e06c75 orange=#d19a66 yellow=#e5c07b magenta=#c678dd
#   black=#3f4451

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-style "bg=#282c34,fg=#abb2bf"

set -g status-left "#[bg=#61afef,fg=#21252b,bold] #S #[fg=#61afef,bg=#3e4451]▌#[fg=#828997] #{user} #[fg=#3e4451,bg=#282c34]▌ "
set -g status-left-length 50

# Shows seconds
set -g status-right "#{?client_prefix,#[bg=#d19a66,fg=#21252b,bold] PREF #[fg=#d19a66,bg=#282c34]▌ ,}#[fg=#3e4451,bg=#282c34]▐#[bg=#3e4451,fg=#56b6c2] %H:%M:%S #[fg=#61afef,bg=#3e4451]▐#[bg=#61afef,fg=#21252b,bold] %a %d-%b "
set -g status-right-length 60

# Inactive: very dim ghost text
set -g window-status-format "#[fg=#5c6370]  #I #W#{?window_flags, #{window_flags},}  "
set -g window-status-separator ""

# Active: bright green text, NO bg, NO arrows - floating neon
set -g window-status-current-format "#[fg=#98c379,bold]  #I #W#{?window_flags, #{window_flags},}  "

set -g window-status-activity-style "fg=#e5c07b,bg=#282c34"
set -g pane-active-border-style "fg=#61afef"
set -g pane-border-style "fg=#3e4451"
set -g message-style "bg=#3e4451,fg=#abb2bf"
set -g message-command-style "bg=#3e4451,fg=#abb2bf"
set -g mode-style "bg=#61afef,fg=#21252b"
