# Treehouse config for the dotfiles repo (~/.config)
# Repo-level config takes precedence over ~/.config/treehouse/config.toml.
#
# Lightweight repo (config files, no build). Parallel agents here are rare,
# so a small pool is plenty. This file is version-controlled and mirrors
# across both PCs automatically.

# Upper bound on concurrent worktrees for this repo = max agents at once.
max_trees = 3

# No custom `root`: treehouse defaults to ~/.treehouse (OUTSIDE the repo).
# (An explicit root = "$HOME/..." is NOT expanded by treehouse and lands the pool
#  inside the repo as ./worktrees — use an absolute path if you ever set one.)
